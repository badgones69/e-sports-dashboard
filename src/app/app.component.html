<div class="app-layout">
  <!-- Barre supérieure pleine largeur -->
  <mat-toolbar class="app-toolbar">
    <button mat-icon-button (click)="drawer.toggle()" aria-label="Basculer le menu">
      <i class="material-icons">menu</i>
    </button>
  </mat-toolbar>

  <!-- Conteneur principal sous la toolbar -->
  <mat-sidenav-container class="app-sidenav-container">
    
    <!-- Menu pliable à gauche -->
    <mat-sidenav 
      #drawer
      class="app-sidenav"
      [mode]="isMobile() ? 'over' : 'side'"
      [opened]="!isMobile()">
      
    <button
      mat-button
      (click)="drawer.toggle()"
      routerLink="aircrafts/list"
      class="menu-button"
    >
      <i class="material-icons">sports_hockey</i>
      <span>NHL</span>
    </button>
    <button
      mat-button
      (click)="drawer.toggle()"
      routerLink="aircrafts/list"
      class="menu-button"
    >
      <i class="material-icons">sports_soccer</i>
      <span>FIFA 23</span>
    </button>
    <button
      mat-button
      (click)="drawer.toggle()"
      routerLink="aircrafts/list"
      class="menu-button"
    >
      <i class="material-icons">sports_football</i>
      <span>NFL</span>
    </button>
    <button
      mat-button
      (click)="drawer.toggle()"
      routerLink="aircrafts/list"
      class="menu-button"
    >
      <i class="material-icons">sports_basketball</i>
      <span>NBA</span>
    </button>
    <button
      mat-button
      (click)="drawer.toggle()"
      routerLink="aircrafts/list"
      class="menu-button"
    >
      <i class="material-icons">sports_tennis</i>
      <span>Tennis</span>
    </button>
    <button
      mat-button
      (click)="drawer.toggle()"
      routerLink="aircrafts/list"
      class="menu-button"
    >
      <i class="material-icons">sports_motorsports</i>
      <span>F1 / F2</span>
    </button>
    <button
      mat-button
      (click)="drawer.toggle()"
      routerLink="aircrafts/list"
      class="menu-button"
    >
      <i class="material-icons">sports_score</i>
      <span>NASCAR</span>
    </button>
    <button
      mat-button
      (click)="drawer.toggle()"
      routerLink="aircrafts/list"
      class="menu-button"
    >
      <i class="material-icons">two_wheeler</i>
      <span>Motocross</span>
    </button>
    <button
      mat-button
      (click)="drawer.toggle()"
      routerLink="aircrafts/list"
      class="menu-button"
    >
      <i class="material-icons">motorcycle</i>
      <span>MotoGP</span>
    </button>
    <button mat-button class="menu-button">
      <i class="material-icons">info</i>
      <span>À propos</span>
    </button>

    </mat-sidenav>

    <!-- Zone de contenu dynamique à droite -->
    <mat-sidenav-content class="app-content">
      <main class="page-wrapper">
        <router-outlet />
      </main>
    </mat-sidenav-content>

  </mat-sidenav-container>
</div>
